services:
  postgres:
    image: postgres:16
    container_name: llmortem-postgres
    environment:
      POSTGRES_DB: llmortem
      POSTGRES_USER: llmortem
      POSTGRES_PASSWORD: llmortem
    ports:
      - "5432:5432"
    volumes:
      - llmortem_postgres_data:/var/lib/postgresql/data

volumes:
  llmortem_postgres_data:
